# ─── Logstash Pipeline ──────────────────────────────────────────────────────────
# Input:  Filebeat (Beats protocol on port 5044)
# Filter: Parse Docker log format → extract JSON fields from NestJS Winston logs
# Output: Elasticsearch with a daily rolling index pattern

input {
  beats {
    port => 5044
  }
}

filter {
  # ── 1. Surface the container name for routing ─────────────────────────────────
  # Filebeat's add_docker_metadata processor populates [container][name].
  # We copy it to a top-level field for easier use in conditions and Kibana.
  if [container][name] {
    mutate { copy => { "[container][name]" => "container_name" } }
  }

  # ── 2. JSON parsing — booking-api only ───────────────────────────────────────
  # Only the booking-api container emits Winston JSON logs.
  # Postgres, Redis, RabbitMQ, Nginx etc. write plain-text logs that may
  # coincidentally start with "{" — attempting to JSON-parse them produces
  # harmless but noisy WARNs. Scope this block to booking-api to silence them.
  if [container_name] == "booking-api" and [message] =~ /^\{/ {
    json {
      source         => "message"
      target         => "parsed"
      tag_on_failure => ["_jsonparsefailure"]
    }

    # Promote well-known Winston fields to top-level for easy Kibana filtering
    if [parsed][level]     { mutate { copy => { "[parsed][level]"     => "level"     } } }
    if [parsed][message]   { mutate { copy => { "[parsed][message]"   => "log_message" } } }
    if [parsed][context]   { mutate { copy => { "[parsed][context]"   => "context"   } } }
    if [parsed][timestamp] { mutate { copy => { "[parsed][timestamp]" => "@timestamp" } } }
    if [parsed][service]   { mutate { copy => { "[parsed][service]"   => "service"   } } }
    if [parsed][pid]       { mutate { copy => { "[parsed][pid]"       => "pid"       } } }

    # Remove the interim parsed object to keep the indexed document clean
    mutate { remove_field => ["parsed"] }
  }

  # ── 3. Remove noisy / low-value Filebeat metadata fields ─────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "host", "tags"]
  }
}

output {
  # ── booking-api → structured index (ILM: 30-day default) ─────────────────────
  if [container_name] == "booking-api" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "booking-api-logs-%{+YYYY.MM.dd}"
    }
  }

  # ── all other containers → infra index (shorter retention recommended) ────────
  # Includes: postgres, redis, rabbitmq, nginx and any other container.
  # These arrive as plain-text; useful for cross-service incident investigation.
  else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "infra-logs-%{+YYYY.MM.dd}"
    }
  }
}
