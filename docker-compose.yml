name: booking-system

services:
  redis:
    image: redis:8.6-alpine
    container_name: booking_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    # 1. Replace the 'image:' line with this build block
    build:
      context: .
      dockerfile: Dockerfile.postgres

    container_name: booking_postgres # (Use booking_postgres_prod for the prod file)
    restart: unless-stopped
    ports:
      - "${DATABASE_LOCAL_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    # 2. Update the command to preload the library and set the cron database
    command: >
      postgres  -c "max_connections=200"  -c "shared_preload_libraries=pg_cron"  -c "cron.database_name=${DATABASE_NAME}" -c "cron.use_background_workers=on"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 5050:80
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    container_name: booking_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  node-app:
    container_name: booking-api
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      LOKI_URL: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # ⚠️  Dev/perf only – lets k6 registerUser() skip email confirmation.
      #     NEVER set this to 'true' in production.
      SKIP_EMAIL_VERIFICATION: ${SKIP_EMAIL_VERIFICATION:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loki:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - node-app
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: booking_otel_collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./monitoring/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — app traces come in here
      - "4318:4318" # OTLP HTTP
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    container_name: booking_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo query API, used by Grafana
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: booking_loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: booking_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: booking_grafana
    ports:
      # NOTE: host port 3001, not 3000 — node-app already owns 3000.
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      # Dev-only convenience — don't ship this to a shared/prod environment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    # ─── k6 Performance Tests ─────────────────────────────────────────────────
    # Usage (run against the running stack):
    #   docker compose --profile perf run --rm k6 smoke
    #   docker compose --profile perf run --rm k6 load
    #   docker compose --profile perf run --rm k6 stress
    #   docker compose --profile perf run --rm k6 spike
    #   docker compose --profile perf run --rm k6 soak
    #   docker compose --profile perf run --rm k6 breakpoint
    #   docker compose --profile perf run --rm k6 auth
    #   docker compose --profile perf run --rm k6 concurrency
  k6:
    image: grafana/k6:latest
    container_name: booking_k6
    profiles: [ "perf" ]
    volumes:
      - ./k6:/scripts
      # Shared host directory – completed JSON result files land here;
      # Logstash picks them up via the file input in k6-metrics.conf
      - ./k6/results:/k6-results
    environment:
      K6_BASE_URL: ${K6_BASE_URL:-http://nginx:80}
      K6_SOAK_DURATION: ${K6_SOAK_DURATION:-30m}
      # Tell k6 where to stream live metrics (Logstash k6 pipeline)
      # NOTE: k6's Logstash streaming output was removed along with the ELK
      # stack. run-tests.ps1 degrades gracefully if this isn't reachable,
      # but if you want live k6 metrics in the new stack, k6 supports a
      # `xk6-output-prometheus-remote` output pointed at Prometheus's
      # remote-write endpoint — that's a separate follow-up, not done here.
      K6_LOGSTASH_HOST: logstash
      K6_LOGSTASH_PORT: 5001
    # Entrypoint expects sh -c to execute the inline script
    # $1 will receive "smoke", "load", "stress", etc. passed via CLI or command
    entrypoint: [ "sh", "/scripts/run.sh" ]
    command: [ "smoke" ]
    depends_on:
      - nginx
    networks:
      - default

volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
