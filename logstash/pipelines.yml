# Logstash multi-pipeline configuration
# Each pipeline runs independently with its own input/filter/output.
# Reference: https://www.elastic.co/guide/en/logstash/current/multiple-pipelines.html

- pipeline.id: app-logs
  path.config: "/usr/share/logstash/pipeline/logstash.conf"
  pipeline.workers: 2

- pipeline.id: k6-metrics
  path.config: "/usr/share/logstash/pipeline/k6-metrics.conf"
  pipeline.workers: 1
