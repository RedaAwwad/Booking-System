# Logstash pipeline 2 – k6 Performance Metrics (TCP 5001 → ES)
#
# k6 is configured with:   --out json=/dev/stdout
# The k6 service pipes its stdout here via TCP using `nc` or the
# `--out json` flag written to a named pipe inside the container.
#
# Alternatively, k6 sends the JSON metrics file content on shutdown
# and this pipeline reads it from a shared Docker volume file input.
#
# IMPORTANT: k6 outputs one JSON object per line. Each line is a "Point":
#   { "type": "Point", "data": { "name": "http_req_duration", "value": 123, ... }, "metric": "http_req_duration" }

input {
  # k6 streams metrics via TCP on port 5001 (separate from app logs on 5000)
  tcp {
    port  => 5001
    codec => json_lines
  }

  # Also watch the shared JSON result file written by the k6 container
  file {
    path           => "/k6-results/*.json"
    start_position => "beginning"
    sincedb_path   => "/dev/null"
    codec          => json_lines
    mode           => "read"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/k6-ingested.log"
    tags           => ["k6_file_import"]
  }
}

filter {
  mutate {
    add_field => { "log_source" => "k6" }
  }

  # ── Only process k6 "Point" metric events (skip metadata lines) ────────────
  if [type] != "Point" {
    drop {}
  }

  # ── Flatten the nested k6 data structure for easier Kibana queries ─────────
  # Input shape: { "metric": "http_req_duration", "data": { "name": "...", "value": 123, "tags": {...}, "time": "..." } }
  if [data] {
    mutate {
      rename => {
        "[data][name]"  => "metric_name"
        "[data][value]" => "metric_value"
        "[data][time]"  => "metric_time"
        "[data][tags]"  => "tags"
      }
    }

    # Promote useful tag fields to the top level for easy filtering
    if [tags][url]      { mutate { rename => { "[tags][url]"      => "url"      } } }
    if [tags][method]   { mutate { rename => { "[tags][method]"   => "method"   } } }
    if [tags][status]   { mutate { rename => { "[tags][status]"   => "status"   } } }
    if [tags][name]     { mutate { rename => { "[tags][name]"     => "group"    } } }
    if [tags][endpoint] { mutate { rename => { "[tags][endpoint]" => "endpoint" } } }
    if [tags][scenario] { mutate { rename => { "[tags][scenario]" => "scenario" } } }

    # Convert metric_time string to a proper timestamp
    if [metric_time] {
      date {
        match   => ["metric_time", "ISO8601"]
        target  => "@timestamp"
        remove_field => ["metric_time"]
      }
    }
  }

  # Remove the raw data wrapper now that we've flattened it
  mutate {
    remove_field => ["data", "type"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "k6-metrics-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
