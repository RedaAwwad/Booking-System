# Logstash pipeline 1 – Application logs (NestJS → TCP 5000 → ES)
# This is the original pipeline, now moved to its own file.

input {
  tcp {
    port  => 5000
    codec => json
  }
}

filter {
  # Tag all events coming through this pipeline
  mutate {
    add_field => { "log_source" => "app" }
  }

  # Parse nested message JSON if the app double-encodes
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "booking-app-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
