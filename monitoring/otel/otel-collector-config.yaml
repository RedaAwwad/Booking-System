receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Traces are forwarded to Tempo over OTLP.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics are exposed on :8889 for Prometheus to scrape (pull model,
  # matching how Prometheus expects to work — see prometheus/prometheus.yml).
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]